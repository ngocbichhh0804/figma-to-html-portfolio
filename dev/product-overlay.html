<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Overlay — Glo. product page vs Figma</title>
<style>
  /* Công cụ nội bộ, không giao cho khách: nạp product.html vào iframe
     đúng khổ khung thiết kế (1920 × 1128) rồi đè ảnh export Figma lên trên.
     Nút điều khiển là radio input đọc bằng :has() — không JavaScript.
     Chế độ "Kéo trượt" dùng resize: horizontal của CSS: kéo góc phải dưới
     của lớp Figma để mở rộng / thu hẹp. */
  :root { --frame-w: 1920px; --frame-h: 1128px; }

  * { box-sizing: border-box; }
  body { margin: 0; background: #1e1e1e; font: 14px/1.4 system-ui, sans-serif; color: #eee; }

  .bar {
    position: fixed; inset-block-start: 0; inset-inline: 0; z-index: 10;
    padding: 10px 16px; background: #111; border-block-end: 1px solid #333;
  }
  .bar strong { display: inline-block; vertical-align: middle; font-weight: 600; }
  .bar label {
    display: inline-block; vertical-align: middle;
    margin-inline-start: 20px; cursor: pointer;
  }
  .bar label input { vertical-align: middle; margin-inline-end: 6px; }
  .bar a { color: #9cf; margin-inline-start: 20px; }
  .bar .hint { float: right; opacity: .6; }

  .stage { position: relative; width: var(--frame-w); margin: 56px auto 0; }
  .stage iframe { display: block; width: var(--frame-w); height: var(--frame-h); border: 0; }
  .ov {
    position: absolute; inset-block-start: 0; inset-inline-start: 0;
    width: var(--frame-w); pointer-events: none; opacity: .5;
  }
  .ov img { display: block; width: var(--frame-w); max-width: none; }

  body:has(#m-build:checked)  .ov { opacity: 0; }
  body:has(#m-50:checked)     .ov { opacity: .5; }
  body:has(#m-figma:checked)  .ov { opacity: 1; }
  /* Difference: pixel nào trùng khít thành đen, chỗ lệch sẽ phát sáng. */
  body:has(#m-diff:checked)   .ov { opacity: 1; mix-blend-mode: difference; }
  body:has(#m-diff:checked)   .stage { background: #fff; }
  /* Kéo trượt: trái là Figma, phải là bản code. */
  body:has(#m-slide:checked)  .ov {
    opacity: 1; width: 50%; min-width: 40px; max-width: var(--frame-w);
    height: var(--frame-h); overflow: hidden; resize: horizontal;
    pointer-events: auto; border-inline-end: 2px solid #ff3b30;
  }

  body:has(#grid:checked) .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to right, rgb(0 128 255 / 35%) 0 1px, transparent 1px 100px),
      repeating-linear-gradient(to bottom, rgb(0 128 255 / 35%) 0 1px, transparent 1px 100px);
  }
</style>
</head>
<body>
  <div class="bar">
    <strong>Glo. — Product description</strong>
    <label><input type="radio" name="mode" id="m-build" /> Chỉ bản code</label>
    <label><input type="radio" name="mode" id="m-50" checked /> Đè 50%</label>
    <label><input type="radio" name="mode" id="m-figma" /> Chỉ Figma</label>
    <label><input type="radio" name="mode" id="m-diff" /> Difference</label>
    <label><input type="radio" name="mode" id="m-slide" /> Kéo trượt</label>
    <label><input type="checkbox" id="grid" /> Lưới 100px</label>
    <a href="overlay.html">Trang Shop →</a>
    <a href="landing-overlay.html">Landing page →</a>
    <a href="cart-overlay.html">Giỏ hàng →</a>
    <a href="cart-page-overlay.html">Trang giỏ hàng →</a>
    <span class="hint">1920 × 1128 — zoom trình duyệt để xem vừa màn hình. Kéo trượt: kéo góc dưới cùng bên phải của lớp Figma</span>
  </div>

  <div class="stage">
    <iframe src="../product.html" title="Bản code" scrolling="no"></iframe>
    <div class="ov"><img src="../docs/comparison/product/product-figma.png" alt="Ảnh export từ Figma" /></div>
  </div>
</body>
</html>
